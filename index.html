<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">FlowsChat</title>
  <meta name="theme-color" content="#182d50" />

  <style>
    :root {
      --navy: #182d50;
      --navy2: #294873;
      --pale: #eef3fa;
      --pale-active: #e2ebf8;
      --white: #fff;
      --text: #17243a;
      --muted: #718096;
      --border: #e1e8f1;
      --danger: #c24152;
      --online: #22c55e;
      --offline: #ef4444;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none; 
      user-select: none; 
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: var(--text);
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes chatSlideIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .panel, .landing-card, .messenger-layout {
      animation: fadeInSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .chat-box-ig {
      animation: chatSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .topbar {
      height: 70px;
      padding: 0 5%;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -1.5px;
      color: var(--navy);
      cursor: pointer;
      text-decoration: none;
    }

    .logo span { color: #7598cc; }

    .nav-actions { display: flex; gap: 10px; align-items: center; position: relative; }

    /* Üst Bar Profil Menü (Dropdown) */
    .user-menu-wrapper {
      position: relative;
      display: inline-block;
    }

    .user-menu-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      background: var(--pale);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 750;
      color: var(--navy);
      font-size: 14px;
      letter-spacing: -0.2px;
      transition: all 0.15s ease;
    }

    .user-menu-trigger:hover {
      background: var(--pale-active);
      transform: translateY(-1px);
    }

    .user-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(24, 45, 80, 0.1);
      width: 190px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 50;
      animation: fadeInSlide 0.15s ease forwards;
    }

    .user-dropdown .btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 750;
      justify-content: flex-start;
      letter-spacing: -0.2px;
    }

    .user-dropdown .btn.outline {
      border: 0;
      background: transparent;
      color: var(--navy);
    }
    .user-dropdown .btn.outline:hover {
      background: var(--pale);
      transform: none;
    }

    .user-dropdown .btn.danger {
      background: #fff0f1;
      color: var(--danger);
      border: 0;
    }
    .user-dropdown .btn.danger:hover {
      background: #ffe3e6;
      transform: none;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.03); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    .primary { background: var(--navy); color: white; }
    .secondary { background: var(--pale); color: var(--navy); }
    .outline { background: white; color: var(--navy); border: 1px solid var(--border); }
    .danger { background: #fff0f1; color: var(--danger); }

    .app-layout {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 24px;
    }

    .sidebar, .panel, .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .sidebar {
      padding: 14px;
      height: fit-content;
      position: sticky;
      top: 90px;
      box-shadow: 0 4px 20px rgba(24, 45, 80, 0.03);
    }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #50617b;
      font-weight: 700;
      font-size: 15px;
      text-align: left;
      margin-bottom: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-item:hover {
      background: var(--pale);
      color: var(--navy);
      transform: translateX(2px);
    }

    .nav-item.active {
      background: var(--pale-active);
      color: var(--navy);
      font-weight: 800;
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 4px;
      background: var(--navy);
      border-radius: 0 4px 4px 0;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-icon svg, .avatar svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .nav-item:hover .nav-icon svg { transform: scale(1.1); }

    main { min-width: 0; }

    .welcome {
      border-radius: 22px;
      padding: 27px;
      background: linear-gradient(125deg, #182d50, #365783);
      color: white;
      margin-bottom: 20px;
    }

    .welcome h1 { margin: 0 0 8px; font-size: 27px; }
    .welcome p { margin: 0; color: #dbe6f7; line-height: 1.6; }

    .panel { padding: 23px; margin-bottom: 18px; }
    .panel h2 { margin: 0 0 17px; font-size: 21px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .field { margin: 15px 0; }
    .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 7px; }

    .input {
      width: 100%;
      border: 1px solid #d8e1ed;
      border-radius: 12px;
      padding: 13px 14px;
      background: white;
      outline: none;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus { border-color: #7899c8; box-shadow: 0 0 0 3px #dfeafa; }
    textarea.input { min-height: 90px; resize: vertical; }

    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #edf1f6;
    }

    .user-row:last-child { border-bottom: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-info strong { display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; flex-wrap: wrap; }
    .user-info span { color: var(--muted); font-size: 13px; }

    /* Rozet Sistemi Stilleri */
    .badge-container {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: relative;
      vertical-align: middle;
      margin-left: 4px;
    }

    .badge-item {
      display: inline-grid;
      place-items: center;
      font-size: 14px;
      cursor: help;
      position: relative;
    }

    .badge-more {
      background: var(--pale);
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: background 0.15s;
    }

    .badge-more:hover {
      background: var(--pale-active);
    }

    /* Rozet Detay Modalı / Popover */
    .badge-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.2);
      z-index: 100;
      display: grid;
      place-items: center;
    }

    .badge-modal {
      background: white;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 260px;
      text-align: center;
      animation: fadeInSlide 0.2s ease forwards;
    }

    .badge-modal h4 { margin: 0 0 12px 0; font-size: 16px; color: var(--navy); }
    .badge-modal-list { display: flex; flex-direction: column; gap: 8px; text-align: left; max-height: 180px; overflow-y: auto; }
    .badge-modal-row { display: flex; align-items: center; gap: 10px; padding: 6px; background: #f8fafc; border-radius: 8px; }

    .avatar-container {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e2ebf8;
      color: var(--navy);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.big { width: 90px; height: 90px; font-size: 30px; }
    .avatar.small-top { width: 32px; height: 32px; font-size: 14px; }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .status-dot.big {
      width: 18px;
      height: 18px;
      bottom: 4px;
      right: 4px;
      border-width: 3px;
    }

    .status-dot.online { background-color: var(--online); }
    .status-dot.offline { background-color: var(--offline); }

    .profile-head {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .profile-details { flex: 1; min-width: 180px; }
    .profile-details h2 { margin: 0 0 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stats { display: flex; gap: 22px; margin-top: 15px; flex-wrap: wrap; }
    .stats span { cursor: pointer; color: var(--muted); }
    .stats span:hover { color: var(--navy); }
    .stats strong { color: var(--navy); }
    .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

    .avatar-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      max-width: 420px;
      margin: 0 auto;
    }

    .avatar-btn-group .btn {
      flex: 1;
      width: 100%;
      padding: 13px 18px;
      font-size: 14px;
      white-space: nowrap;
      text-align: center;
    }

    /* Instagram Tarzı Mesajlaşma Yerleşimi */
    .messenger-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      min-height: 580px;
      box-shadow: 0 4px 20px rgba(24, 45, 80, 0.03);
    }

    .messenger-sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #fafbfc;
    }

    .messenger-sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .messenger-sidebar-header h2 { margin: 0; font-size: 20px; }

    .messenger-list {
      overflow-y: auto;
      max-height: 580px;
    }

    .conversation-item {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f0f4f8;
      transition: background 0.15s, border-color 0.15s;
    }

    .conversation-item:hover { background: #f2f6fc; }
    .conversation-item.active { background: var(--pale-active); border-left: 4px solid var(--navy); }

    .messenger-content {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      min-width: 0;
    }

    .chat-box-ig {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
    }

    .chat-head {
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-messages {
      flex: 1;
      min-height: 380px;
      max-height: 440px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fbfcfe;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .bubble-wrapper.mine { align-self: flex-end; align-items: flex-end; }
    .bubble-wrapper.other { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      background: #e9eef6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      position: relative;
    }

    .bubble.mine { background: var(--navy); color: white; }

    .msg-meta {
      font-size: 11px;
      margin-top: 3px;
      color: var(--muted);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .bubble.mine + .msg-meta { color: #889bb5; }
    .seen-badge { color: #38bdf8; font-weight: 800; }

    .chat-compose {
      display: flex;
      gap: 10px;
      padding: 16px;
      background: white;
      border-top: 1px solid var(--border);
    }
    .chat-compose .input { min-width: 0; }

    .notice {
      margin: 15px 0;
      padding: 12px 14px;
      background: #fff6df;
      border: 1px solid #f3e2ae;
      color: #75571a;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .notice.error { background: #fff0f1; border-color: #f2cbd0; color: #9f2637; }
    .notice.success { background: #eaf8ef; border-color: #c9ebd4; color: #246c3c; }

    .empty { padding: 40px 20px; text-align: center; color: var(--muted); line-height: 1.6; }

    .landing {
      min-height: calc(100vh - 70px);
      display: grid;
      place-items: center;
      padding: 30px 18px;
      background: radial-gradient(ellipse at top right, #dce8f8, transparent 48%), #f5f7fb;
    }

    .landing-card {
      width: min(480px, 100%);
      background: white;
      padding: 38px;
      border-radius: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 65px #1c345414;
      text-align: center;
    }

    .landing-card h1 { font-size: 46px; letter-spacing: -2px; color: var(--navy); margin: 0 0 10px; }
    .landing-card p { color: var(--muted); line-height: 1.65; }
    .google-btn {
      width: 100%;
      margin-top: 18px;
      border: 1px solid #d8e1ed;
      border-radius: 12px;
      padding: 14px;
      background: white;
      color: var(--text);
      font-weight: 750;
    }
    .google-btn:hover { background: #f8faff; }

    .loading { padding: 35px; text-align: center; color: var(--muted); }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #edf1f6;
    }

    @media (max-width: 820px) {
      .topbar { padding: 0 16px; height: 62px; }
      .logo { font-size: 25px; }
      .app-layout { display: block; margin: 15px auto; padding: 0 12px; }
      .sidebar {
        position: static;
        display: flex;
        justify-content: space-around;
        overflow-x: auto;
        gap: 8px;
        padding: 8px;
        margin-bottom: 15px;
      }
      .nav-item {
        width: auto;
        flex-shrink: 0;
        margin: 0;
        padding: 10px 14px;
        border-radius: 12px;
      }
      .nav-item.active::before { display: none; }
      .nav-item .nav-label { display: none; }
      .nav-icon { width: auto; }
      .messenger-layout { grid-template-columns: 1fr; }
      .messenger-content { display: none; }
      .messenger-content.mobile-active { display: flex; }
      .messenger-sidebar.mobile-hidden { display: none; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a href="#main" class="logo">fl<span>o</span>w</a>
    <div class="nav-actions" id="topActions">
      <button class="btn outline" data-action="signin">Google ile giriş</button>
    </div>
  </header>

  <div id="noticeArea" style="max-width:1180px;margin:12px auto;padding:0 18px;"></div>
  <div id="app"></div>
  <div id="modalContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, query, where, orderBy, limit, getDocs, addDoc,
      onSnapshot, runTransaction, serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    import { firebaseConfig } from "./firebaseConfig.js";
    import { adminEmails } from "./adminList.js";
    import { adminEmails as verifiedEmails } from "./verifiedList.js";

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: "select_account" });

    const appEl = document.getElementById("app");
    const topActions = document.getElementById("topActions");
    const noticeArea = document.getElementById("noticeArea");
    const pageTitleEl = document.getElementById("pageTitle");
    const modalContainer = document.getElementById("modalContainer");

    let currentUser = null;
    let myProfile = null;
    let viewedProfile = null;
    let activeConversation = null;
    let stopMessages = null;
    let stopConversationList = null;
    let stopGlobalUnread = null;
    let stopViewedProfileLive = null;
    let presenceInterval = null;
    let busy = false;
    let isUserMenuOpen = false;

    const profileCache = new Map();
    let currentSearchResults = [];
    let currentSearchPage = 1;
    const PAGE_SIZE = 20;

    const $ = (selector, root = document) => root.querySelector(selector);

    function isAdmin(email) {
      if (!email || typeof email !== "string" || !email.trim()) return false;
      const cleanEmail = email.toLowerCase().trim();
      const list = Array.isArray(adminEmails) ? adminEmails : [];
      return list.some(e => typeof e === "string" && e.toLowerCase().trim() === cleanEmail);
    }

    function isVerified(email) {
      if (!email || typeof email !== "string" || !email.trim()) return false;
      const cleanEmail = email.toLowerCase().trim();
      const list = Array.isArray(verifiedEmails) ? verifiedEmails : [];
      return list.some(e => typeof e === "string" && e.toLowerCase().trim() === cleanEmail);
    }

    function getUserBadges(profileOrEmail) {
      const email = typeof profileOrEmail === "string" ? profileOrEmail : profileOrEmail?.email;
      const badges = [];

      if (isAdmin(email)) {
        badges.push({ icon: "👑", title: "Kurucu" });
      }

      if (isVerified(email)) {
        badges.push({ icon: "✔️", title: "Onaylanmış" });
      }

      return badges;
    }

    function renderBadgesHTML(profileOrEmail) {
      const badges = getUserBadges(profileOrEmail);
      if (badges.length === 0) return "";

      const maxDisplay = 3;
      const visibleBadges = badges.slice(0, maxDisplay);
      const remainingCount = badges.length - maxDisplay;

      let html = `<span class="badge-container">`;
      visibleBadges.forEach(b => {
        html += `<span class="badge-item" title="${escapeHTML(b.title)}">${b.icon}</span>`;
      });

      if (remainingCount > 0) {
        html += `<span class="badge-more" data-action="show-all-badges" data-email="${escapeHTML(typeof profileOrEmail === 'string' ? profileOrEmail : profileOrEmail?.email || '')}">+${remainingCount}</span>`;
      }
      html += `</span>`;
      return html;
    }

    function showAllBadgesModal(email) {
      const badges = getUserBadges(email);
      if (badges.length === 0) return;

      modalContainer.innerHTML = `
        <div class="badge-modal-backdrop" data-action="close-modal">
          <div class="badge-modal" onclick="event.stopPropagation()">
            <h4>Kullanıcı Rozetleri</h4>
            <div class="badge-modal-list">
              ${badges.map(b => `
                <div class="badge-modal-row">
                  <span style="font-size:20px">${b.icon}</span>
                  <strong>${escapeHTML(b.title)}</strong>
                </div>
              `).join("")}
            </div>
            <button class="btn primary" style="width:100%;margin-top:15px;padding:8px;" data-action="close-modal">Kapat</button>
          </div>
        </div>
      `;
    }

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function isUserOnline(profile) {
      if (!profile) return false;
      if (currentUser && profile.uid === currentUser.uid) return true;
      const lastSeen = profile.lastSeen;
      if (!lastSeen) return false;
      const lastSeenDate = lastSeen.toDate ? lastSeen.toDate() : new Date(lastSeen);
      if (isNaN(lastSeenDate.getTime())) return false;
      const diffSec = (Date.now() - lastSeenDate.getTime()) / 1000;
      return diffSec < 60;
    }

    function avatarHTML(profile, big = false, smallTop = false) {
      let size = "avatar";
      if (big) size = "avatar big";
      if (smallTop) size = "avatar small-top";

      const online = isUserOnline(profile);
      const statusClass = online ? "online" : "offline";

      let imgTag = "";
      if (profile?.photoURL) {
        imgTag = `<div class="${size}"><img src="${escapeHTML(profile.photoURL)}" alt=""></div>`;
      } else {
        const letter = (profile?.nickname || profile?.displayName || "?").trim().charAt(0).toUpperCase();
        imgTag = `<div class="${size}">${escapeHTML(letter || "?")}</div>`;
      }

      return `
        <div class="avatar-container">

          <div class="${dotSize} ${statusClass}"></div>
        </div>`;
    }

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function errorMessage(error) {
      console.error("Flow hata ayrıntısı:", error);
      if (error?.code === "permission-denied") {
        return "Firebase erişimi reddedildi. Firestore Rules bölümünü kontrol et.";
      }
      if (error?.code === "auth/unauthorized-domain") {
        return "Bu site Firebase'de yetkili değil. Authentication → Settings → Authorized domains bölümüne site adresini ekle.";
      }
      if (error?.code === "auth/popup-blocked") {
        return "Google giriş penceresi engellendi. Tarayıcıda açılır pencerelere izin ver.";
      }
      if (error?.code === "auth/popup-closed-by-user") {
        return "Giriş penceresi kapatıldı veya tarayıcı engelledi.";
      }
      return error?.message || "Beklenmeyen bir hata oluştu.";
    }

    function reportError(error) {
      showNotice(errorMessage(error), "error");
    }

      if (stopMessages) stopMessages();
      if (stopConversationList) stopConversationList();

      stopMessages = null;
      stopConversationList = null;
      stopViewedProfileLive = null;
    }

    function startPresenceHeartbeat() {
      if (presenceInterval) clearInterval(presenceInterval);
      if (!currentUser) return;

      const updatePresence = async () => {
        try {
          const now = new Date();
          await updateDoc(userRef(currentUser.uid), {
            lastSeen: now
          });
          if (myProfile) myProfile.lastSeen = now;
        } catch (e) {
          console.warn("Aktiflik güncellenemedi:", e);
        }
      };

      updatePresence();
      presenceInterval = setInterval(updatePresence, 20000);
    }

    function startGlobalUnreadListener() {
      if (stopGlobalUnread) stopGlobalUnread();
      if (!currentUser) return;

      const q = query(
        collection(db, "conversations"),
        where("participants", "array-contains", currentUser.uid)
      );

      stopGlobalUnread = onSnapshot(q, snapshot => {
        let unreadTotal = 0;
        snapshot.docs.forEach(docSnap => {
          const data = docSnap.data();
          const unreadMap = data.unreadCount || {};
          unreadTotal += (unreadMap[currentUser.uid] || 0);
        });
        updatePageTitle(unreadTotal);
      }, error => console.warn("Global bildirim dinleme hatası:", error));
    }

    async function signIn() {
      if (busy) return;
      busy = true;
      showNotice("");
      try {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          await signInWithRedirect(auth, googleProvider);
        } else {
          await signInWithPopup(auth, googleProvider);
        }
      } catch (error) {
        reportError(error);
      } finally {
        busy = false;
      }
    }

    async function logout() {
      isUserMenuOpen = false;
      stopLiveListeners();
      if (presenceInterval) {
        clearInterval(presenceInterval);
        presenceInterval = null;
      }
      if (stopGlobalUnread) {
        stopGlobalUnread();
        stopGlobalUnread = null;
      }
      activeConversation = null;
      profileCache.clear();
      updatePageTitle(0);
      try {
        if (currentUser) {
          await updateDoc(userRef(currentUser.uid), { lastSeen: new Date(0) });
        }
        await signOut(auth);
        showNotice("");
      } catch (error) {
        reportError(error);
      }
    }

              profiles.push({ uid: docSnap.id, ...data });

        currentSearchResults = profiles;
        currentSearchPage = 1;

        renderPaginatedResults(targetId, "Tanıyor olabileceğiniz kişiler");

    function setupAvatarUpload() {
      const fileInput = document.getElementById("avatarInput");
      if (!fileInput) return;

      fileInput.addEventListener("change", async e => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          showNotice("Profil fotoğrafı 2MB'dan küçük olmalıdır.", "error");
          return;
        }

        showNotice("Fotoğraf yükleniyor...", "");
        try {
          const reader = new FileReader();
          reader.onload = async event => {
            const img = new Image();
            img.onload = async () => {
              const canvas = document.createElement("canvas");
              const MAX_WIDTH = 250;
              const MAX_HEIGHT = 250;
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              const dataUrl = canvas.toDataURL("image/jpeg", 0.8);

              await updateDoc(userRef(currentUser.uid), {
                photoURL: dataUrl,
                updatedAt: new Date()
              });

              myProfile.photoURL = dataUrl;
              profileCache.set(currentUser.uid, myProfile);
              updateTopBar();
              showNotice("Profil fotoğrafı güncellendi.", "success");
              renderProfile();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        } catch (error) {
          reportError(error);
        }
      });
    }

    async function showUserList(uid, type, ownerNickname) {
      try {
        showNotice("");
        const snapshot = await getDocs(collection(db, "users", uid, type));
        const users = [];
        const seenNicks = new Set();

        for (const docSnap of snapshot.docs) {
          const data = docSnap.data();
          if (data.uid) {
            try {
              const p = await loadProfile(data.uid);
              const nick = (p.nickname || "").toLowerCase().trim();
              if (nick && !seenNicks.has(nick)) {
                seenNicks.add(nick);
                users.push(p);
              }
            } catch {
              const nick = (data.nickname || "").toLowerCase().trim();
              if (nick && !seenNicks.has(nick)) {
                seenNicks.add(nick);
                users.push({ uid: data.uid, nickname: data.nickname || "kullanici", displayName: "Kullanıcı" });
              }
            }
          }
        }

        const title = type === "followers" ? "Takipçiler" : "Takip Edilenler";
        const backTarget = (ownerNickname && ownerNickname !== myProfile.nickname)
          ? `#profiles?${escapeHTML(ownerNickname)}`
          : `#profiles`;

        renderShell(`
          <section class="panel">
            <a class="btn outline" href="${backTarget}">← Profile dön</a>
            <h2 style="margin-top:18px">${title} (${users.length})</h2>
            <div class="message-list">
              ${users.length === 0 ? `<div class="empty">Bu listede henüz kimse yok.</div>` : users.map(u => userRowHTML(u, `list_${ownerNickname}`)).join("")}
            </div>
          </section>
        `);
      } catch (error) {
        reportError(error);
      }
    }

    function userRowHTML(profile, fromSource = "") {

      return `
        <div class="user-row">
          ${avatarHTML(profile)}
          <div class="user-info">

            <span>@${escapeHTML(profile.nickname)}</span>

    async function searchUsers(search, targetId) {
      const target = document.getElementById(targetId);
      if (!target) return;
      const term = String(search || "").trim().toLowerCase().replace(/^@/, "");

      if (!term) {
        loadRandomSuggestions(targetId);
        return;
      }

      target.innerHTML = `<p class="muted">Aranıyor...</p>`;
      try {
        const usersRef = collection(db, "users");
        const q = query(
          usersRef,
          where("nickname", ">=", term),
          where("nickname", "<=", term + "\uf8ff"),
          limit(100)
        );
        const snapshot = await getDocs(q);

        const seenNicks = new Set();
        const seenEmails = new Set();
        const profiles = [];

        snapshot.docs.forEach(docSnap => {
          const data = docSnap.data();
          const nick = (data.nickname || "").toLowerCase().trim();
          const email = (data.email || "").toLowerCase().trim();

          if (nick && !seenNicks.has(nick)) {
            if (!email || !seenEmails.has(email)) {
              seenNicks.add(nick);
              if (email) seenEmails.add(email);
              profiles.push({ uid: docSnap.id, ...data });
              profileCache.set(docSnap.id, { uid: docSnap.id, ...data });
            }
          }
        });

        currentSearchResults = profiles;
        currentSearchPage = 1;

        if (profiles.length === 0) {
          target.innerHTML = `<div class="empty">“@${escapeHTML(term)}” ile başlayan bir kullanıcı bulunamadı.</div>`;
          return;
        }

        renderPaginatedResults(targetId, `Arama sonuçları (${profiles.length})`);
      } catch (error) {
        target.innerHTML = "";
        reportError(error);
      }
    }

    async function saveNickname(nickname) {
      const clean = nickname.trim().toLowerCase();
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(clean)) {
        throw new Error("Nickname 3–20 karakter olmalı; harf, rakam ve alt çizgi kullanılabilir.");
      }

      const nRef = nicknameRef(clean);
      const uRef = userRef(currentUser.uid);

      await runTransaction(db, async transaction => {
        const nicknameSnap = await transaction.get(nRef);
        if (nicknameSnap.exists() && nicknameSnap.data().uid !== currentUser.uid) {
          throw new Error("Bu nickname zaten kullanılıyor. Başka bir tane dene.");
        }

        const userSnap = await transaction.get(uRef);
        const oldNickname = userSnap.exists() ? userSnap.data().nickname : null;

        if (oldNickname && oldNickname !== clean) {
          transaction.delete(nicknameRef(oldNickname));
        }

        transaction.set(nRef, {
          uid: currentUser.uid,
          nickname: clean,
          createdAt: new Date()
        });

        transaction.set(uRef, {
          uid: currentUser.uid,
          nickname: clean,
          displayName: currentUser.displayName || clean,
          email: currentUser.email || "",
          photoURL: currentUser.photoURL || "",
          bio: userSnap.exists() ? (userSnap.data().bio || "") : "",
          lastSeen: new Date(),
          createdAt: userSnap.exists() ? (userSnap.data().createdAt || new Date()) : new Date(),
          updatedAt: new Date()
        }, { merge: true });
      });
    }

    async function saveProfile(form) {
      const data = new FormData(form);
      const rawNickname = String(data.get("nickname") || "").trim().toLowerCase();
      const displayName = String(data.get("displayName") || "").trim();
      const bio = String(data.get("bio") || "").trim();

      if (!rawNickname) throw new Error("Nickname boş olamaz.");
      if (!displayName) throw new Error("Görünen ad boş olamaz.");

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(rawNickname)) {
        throw new Error("Nickname 3–20 karakter olmalı; harf, rakam ve alt çizgi kullanılabilir.");
      }

      const emojiRegex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}\u2600-\u27BF]/u;
      if (emojiRegex.test(displayName)) {
        throw new Error("Görünen ad içinde emoji kullanılamaz.");
      }

      const linkRegex = /(https?:\/\/|www\.|[a-zA-Z0-9-]+\.(com|net|org|io|gov|edu|tr|co|me|info|biz))/i;
      if (linkRegex.test(displayName)) {
        throw new Error("Görünen ad içinde link (URL) kullanılamaz.");
      }
      if (linkRegex.test(bio)) {
        throw new Error("Biyografide link (URL) kullanılamaz.");
      }

      const codeRegex = /(<[^>]*>|function\s*\(|console\.log|eval\(|var\s+|let\s+|const\s+)/i;
      if (codeRegex.test(bio)) {
        throw new Error("Biyografide kod veya HTML etiketleri kullanılamaz.");
      }

      const nRef = nicknameRef(rawNickname);
      const uRef = userRef(currentUser.uid);
      const oldNickname = myProfile.nickname;

      await runTransaction(db, async transaction => {
        if (rawNickname !== oldNickname) {
          const nicknameSnap = await transaction.get(nRef);
          if (nicknameSnap.exists() && nicknameSnap.data().uid !== currentUser.uid) {
            throw new Error("Bu nickname zaten başkası tarafından kullanılıyor. Başka bir tane dene.");
          }
          transaction.delete(nicknameRef(oldNickname));
          transaction.set(nRef, {
            uid: currentUser.uid,
            nickname: rawNickname,
            createdAt: new Date()
          });
        }

        transaction.update(uRef, {
          nickname: rawNickname,
          displayName: displayName.slice(0, 40),
          bio: bio.slice(0, 160),
          email: currentUser.email || "",
          updatedAt: new Date()
        });
      });

      myProfile = { ...myProfile, nickname: rawNickname, displayName, bio, email: currentUser.email || "" };
      profileCache.set(currentUser.uid, myProfile);
      updateTopBar();
      showNotice("Profilin güncellendi.", "success");
      renderProfile();
    }

    async function toggleFollow(profile) {
      if (!profile || profile.uid === currentUser.uid) return;

      const followingRef = doc(db, "users", currentUser.uid, "following", profile.uid);
      const followerRef = doc(db, "users", profile.uid, "followers", currentUser.uid);

      try {
        showNotice("");
        let didFollow = false;

        await runTransaction(db, async transaction => {
          const followingSnap = await transaction.get(followingRef);
          if (followingSnap.exists()) {
            transaction.delete(followingRef);
            transaction.delete(followerRef);
          } else {
            transaction.set(followingRef, {
              uid: profile.uid,
              nickname: profile.nickname,
              createdAt: new Date()
            });
            transaction.set(followerRef, {
              uid: currentUser.uid,
              nickname: myProfile.nickname,
              createdAt: new Date()
            });
            didFollow = true;
          }
        });

        if (didFollow) {
          try {
            await addDoc(collection(db, "users", profile.uid, "notifications"), {
              type: "follow",
              fromUid: currentUser.uid,
              fromNickname: myProfile.nickname,
              text: `@${myProfile.nickname} seni takip etmeye başladı.`,
              createdAt: new Date(),
              read: false
            });
          } catch (notificationError) {
            console.warn("Bildirim yazılamadı:", notificationError);
          }
        }

        showNotice(didFollow ? "Kullanıcı takip edildi." : "Takipten çıkıldı.", "success");
      } catch (error) {
        reportError(error);
      }
    }

    function conversationId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    async function startConversation(otherProfile) {
      if (!otherProfile || otherProfile.uid === currentUser.uid) return;

      try {
        const id = conversationId(currentUser.uid, otherProfile.uid);
        const cRef = doc(db, "conversations", id);
        const snap = await getDoc(cRef);

        if (!snap.exists()) {
          await setDoc(cRef, {
            participants: [currentUser.uid, otherProfile.uid].sort(),
            participantInfo: {
              [currentUser.uid]: {
                nickname: myProfile.nickname,
                displayName: myProfile.displayName || myProfile.nickname,
                photoURL: myProfile.photoURL || ""
              },
              [otherProfile.uid]: {
                nickname: otherProfile.nickname,
                displayName: otherProfile.displayName || otherProfile.nickname,
                photoURL: otherProfile.photoURL || ""
              }
            },
            lastMessage: "",
            unreadCount: {
              [currentUser.uid]: 0,
              [otherProfile.uid]: 0
            },
            updatedAt: new Date(),
            createdAt: new Date()
          });
        }

        activeConversation = { id, otherProfile };
        window.location.hash = "#message";
      } catch (error) {
        reportError(error);
      }
    }

    async function clearUnread(conversationId) {
      try {
        const cRef = doc(db, "conversations", conversationId);
        const snap = await getDoc(cRef);
        if (!snap.exists()) return;
        const data = snap.data();
        const unreadMap = data.unreadCount || {};
        if (unreadMap[currentUser.uid] > 0) {
          unreadMap[currentUser.uid] = 0;
          await updateDoc(cRef, { unreadCount: unreadMap });
        }
      } catch (error) {
        console.warn("Okunmamış sayaç sıfırlanamadı:", error);
      }
    }

            <div class="messenger-sidebar-header">
              <h2>Mesajlar</h2>
            </div>

              <div class="loading">Sohbetler yükleniyor...</div>
            </div>
          </div>

      `);
      
      listenToConversationList();

    let cachedConversations = [];

    function listenToConversationList() {
      if (stopConversationList) stopConversationList();

      const conversationsRef = collection(db, "conversations");
      const q = query(
        conversationsRef,
        where("participants", "array-contains", currentUser.uid),
        orderBy("updatedAt", "desc"),
        limit(50)
      );

      stopConversationList = onSnapshot(q, async snapshot => {
        const list = $("#conversationList");
        if (!list) return;

        if (snapshot.empty) {
          list.innerHTML = `<div class="empty">Henüz sohbetin yok.<br>Kullanıcı ara ve birine mesaj gönder.</div>`;
          return;
        }

        const entries = [];
        const seenNicks = new Set();

        for (const d of snapshot.docs) {
          const data = d.data();
          const otherUid = (data.participants || []).find(uid => uid !== currentUser.uid);
          if (otherUid) {
            let profile = null;
            try { 
              profile = await loadProfile(otherUid); 
            } catch { 
              const info = data.participantInfo?.[otherUid];
              profile = { uid: otherUid, nickname: info?.nickname || "kullanıcı", displayName: info?.displayName || "Kullanıcı" }; 
            }
            const nick = (profile.nickname || "").toLowerCase().trim();
            if (nick && !seenNicks.has(nick)) {
              seenNicks.add(nick);
              const unreadMap = data.unreadCount || {};
              const unread = unreadMap[currentUser.uid] || 0;
              entries.push({ id: d.id, profile, lastMessage: data.lastMessage || "", unread });
            }
          }
        }

        cachedConversations = entries;
        if (!list.isConnected) return;

        list.innerHTML = entries.map(entry => {
          const isActive = activeConversation && activeConversation.id === entry.id ? "active" : "";
          return `
            <div class="conversation-item ${isActive}" data-action="open-chat" data-uid="${escapeHTML(entry.profile.uid)}" data-conv-id="${escapeHTML(entry.id)}">
              ${avatarHTML(entry.profile)}
              <div class="user-info">
                <strong>${escapeHTML(entry.profile.displayName || entry.profile.nickname)}${renderBadgesHTML(entry.profile)}</strong>
                <span>${escapeHTML(entry.lastMessage || "Sohbete başla")}</span>
              </div>
              ${entry.unread > 0 ? `<span style="background:var(--danger);color:white;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700">${entry.unread}</span>` : ""}
            </div>`;
        }).join("");
      }, error => reportError(error));
    }

    let stopChatHeaderLive = null;
    function renderChat() {
      const panel = $("#chatPanel");
      if (!panel || !activeConversation) return;
      const p = activeConversation.otherProfile;

      panel.innerHTML = `
        <div class="chat-box-ig">
          <div class="chat-head" id="chatHeaderContainer">
            <button class="btn outline" data-action="back-to-list" style="padding:6px 10px;display:none;" id="backToListBtn">←</button>
            ${avatarHTML(p)}
            <div style="flex:1;">
              <strong>${escapeHTML(p.displayName || p.nickname)}${renderBadgesHTML(p)}</strong>
              <div class="muted small">@${escapeHTML(p.nickname)}</div>
            </div>
          </div>
          <div class="chat-messages" id="chatMessages"><div class="muted">Mesajlar yükleniyor...</div></div>
          <form class="chat-compose" id="sendMessageForm">
            <input class="input" name="message" maxlength="2000" placeholder="Bir mesaj yaz..." autocomplete="off" required>
            <button class="btn primary" type="submit">Gönder</button>
          </form>
        </div>`;

      if (window.innerWidth <= 820) {
        const backBtn = document.getElementById("backToListBtn");
        if (backBtn) backBtn.style.display = "inline-grid";

      }

      if (stopChatHeaderLive) stopChatHeaderLive();
      stopChatHeaderLive = onSnapshot(userRef(p.uid), docSnap => {

        const updatedProfile = { uid: p.uid, ...docSnap.data() };
        activeConversation.otherProfile = updatedProfile;
        profileCache.set(p.uid, updatedProfile);
        const headEl = $("#chatHeaderContainer");
        if (headEl) {
          const backBtnHtml = window.innerWidth <= 820 ? `<button class="btn outline" data-action="back-to-list" style="padding:6px 10px;" id="backToListBtn">←</button>` : '';
          headEl.innerHTML = `
            ${backBtnHtml}
            ${avatarHTML(updatedProfile)}
            <div style="flex:1;">
              <strong>${escapeHTML(updatedProfile.displayName || updatedProfile.nickname)}${renderBadgesHTML(updatedProfile)}</strong>
              <div class="muted small">@${escapeHTML(updatedProfile.nickname)}</div>
            </div>`;
        }
      });

    async function openChatById(convId, profile) {
      if (activeConversation && activeConversation.id === convId) return;

      activeConversation = { id: convId, otherProfile: profile };
      clearUnread(convId);
      renderChat();
      listenToMessages();

      document.querySelectorAll(".conversation-item").forEach(item => {
        if (item.dataset.convId === convId) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });
    }

    function listenToMessages() {
      if (stopMessages) stopMessages();
      if (!activeConversation) return;

      const messagesRef = collection(db, "conversations", activeConversation.id, "messages");
      const q = query(messagesRef, orderBy("createdAt", "asc"), limit(100));

      stopMessages = onSnapshot(q, async snapshot => {
        const container = $("#chatMessages");
        if (!container) return;

        if (snapshot.empty) {
          container.innerHTML = `<div class="empty">İlk mesajı sen gönder 👋</div>`;
          return;
        }

        const docs = snapshot.docs;
        const unreadBatch = [];

        docs.forEach(docSnap => {
          const msg = docSnap.data();
          if (msg.senderId !== currentUser.uid && !msg.read) {
            unreadBatch.push(docSnap.ref);
          }
        });

        if (unreadBatch.length > 0) {
          const batch = writeBatch(db);
          unreadBatch.forEach(ref => batch.update(ref, { read: true }));
          await batch.commit().catch(e => console.warn("Mesaj okundu güncellenemedi:", e));
          clearUnread(activeConversation.id);
        }

        const lastMsgIndex = docs.length - 1;

        container.innerHTML = docs.map((d, index) => {
          const msg = d.data();
          const isMine = msg.senderId === currentUser.uid;
          const timeStr = formatTime(msg.createdAt);
          const isLast = index === lastMsgIndex;

          let seenStatus = "";
          if (isMine && isLast) {
            seenStatus = msg.read ? `<span class="seen-badge">✓✓ Görüldü</span>` : `<span>✓ İletildi</span>`;
          }

          return `
            <div class="bubble-wrapper ${isMine ? "mine" : "other"}">
              <div class="bubble ${isMine ? "mine" : ""}">${escapeHTML(msg.text || "")}</div>
              <div class="msg-meta">
                <span>${timeStr}</span>
                ${seenStatus}
              </div>
            </div>`;
        }).join("");

        container.scrollTop = container.scrollHeight;
      }, error => reportError(error));
    }

    async function sendMessage(form) {
      if (!activeConversation) return;
      const data = new FormData(form);
      const text = String(data.get("message") || "").trim();
      if (!text) return;

      form.reset();
      try {
        const cRef = doc(db, "conversations", activeConversation.id);
        const cSnap = await getDoc(cRef);
        const cData = cSnap.data() || {};
        const participants = cData.participants || [];
        const otherUid = participants.find(uid => uid !== currentUser.uid);

        const unreadMap = cData.unreadCount || {};
        if (otherUid) {
          unreadMap[otherUid] = (unreadMap[otherUid] || 0) + 1;
        }

        const mRef = collection(cRef, "messages");
        await addDoc(mRef, {
          senderId: currentUser.uid,
          text,
          createdAt: new Date(),
          read: false
        });

        await updateDoc(cRef, {
          lastMessage: text,
          unreadCount: unreadMap,
          updatedAt: new Date()
        });
      } catch (error) {
        reportError(error);
      }
    }

    function handleRoute() {
      if (!currentUser) return;
      const hash = window.location.hash || "#main";
      
      showNotice("");
      if (!hash.startsWith("#message")) {
        if (stopMessages) { stopMessages(); stopMessages = null; }
        if (stopChatHeaderLive) { stopChatHeaderLive(); stopChatHeaderLive = null; }
        activeConversation = null;
      }
      if (!hash.startsWith("#profiles")) {
        if (stopViewedProfileLive) { stopViewedProfileLive(); stopViewedProfileLive = null; }
      }

      if (hash === "#main") {
        renderHome();
      } else if (hash.startsWith("#search")) {
        const [_, queryString] = hash.split("?");
        renderSearch(queryString || "");
      } else if (hash.startsWith("#profiles")) {
        const hashContent = hash.substring(10);
        if (!hashContent) {
          renderProfile();
        } else {
          const params = new URLSearchParams(hashContent);
          const nick = hashContent.split("&")[0];
          const fromSource = params.get("from") || "";
          loadProfileByNickname(nick, fromSource);
        }
      } else if (hash.startsWith("#message")) {
        renderMessagesPage();
      } else {
        renderHome();
      }
    }

    function updateTopBar() {
      if (!currentUser) {
        topActions.innerHTML = `<button class="btn outline" data-action="signin">Google ile giriş</button>`;
      } else if (myProfile?.nickname) {
        topActions.innerHTML = `
          <div class="user-menu-wrapper">
            <button class="user-menu-trigger" data-action="toggle-user-menu">
              ${avatarHTML(myProfile, false, true)}
              <span>@${escapeHTML(myProfile.nickname)}</span>
            </button>
            ${isUserMenuOpen ? `
              <div class="user-dropdown">
                <a class="btn outline" href="#profiles" data-action="close-user-menu">👤 Profile Git</a>
                <button class="btn danger" data-action="logout">🚪 Çıkış Yap</button>
              </div>
            ` : ""}
          </div>`;
      } else {
        topActions.innerHTML = `<button class="btn danger" data-action="logout">Çıkış</button>`;
      }
    }

    window.addEventListener("hashchange", () => {
      isUserMenuOpen = false;
      updateTopBar();
      handleRoute();
    });

    document.addEventListener("click", async e => {
      const btn = e.target.closest("[data-action]");
      
      if (!btn) {
        if (isUserMenuOpen && !e.target.closest(".user-menu-wrapper")) {
          isUserMenuOpen = false;
          updateTopBar();
        }
        if (e.target.classList.contains("badge-modal-backdrop")) {
          modalContainer.innerHTML = "";
        }
        return;
      }

      const action = btn.dataset.action;
      const uid = btn.dataset.uid;
      const type = btn.dataset.type;
      const ownerNickname = btn.dataset.ownerNickname;
      const convId = btn.dataset.convId;
      const email = btn.dataset.email;

      if (action === "signin") signIn();
      if (action === "logout") logout();
      if (action === "remove-avatar") removeAvatar();
      if (action === "close-modal") modalContainer.innerHTML = "";
      if (action === "close-user-menu") {
        isUserMenuOpen = false;
        updateTopBar();
      }
      if (action === "toggle-user-menu") {
        e.stopPropagation();
        isUserMenuOpen = !isUserMenuOpen;
        updateTopBar();
      }
      if (action === "show-all-badges") {
        e.stopPropagation();
        showAllBadgesModal(email);
      }
      if (action === "back-to-list") {
        const contentEl = document.getElementById("messengerContent");
        const sidebarEl = document.getElementById("messengerSidebar");
        if (contentEl && sidebarEl) {
          contentEl.classList.remove("mobile-active");
          sidebarEl.classList.add("mobile-hidden");
        }
      }
      if (action === "prev-page") {
        currentSearchPage--;
        renderPaginatedResults("searchResults");
      }
      if (action === "next-page") {
        currentSearchPage++;
        renderPaginatedResults("searchResults");
      }
      if (action === "show-list" && uid && type) showUserList(uid, type, ownerNickname);
      if (action === "toggle-settings") {
        const panel = document.getElementById("settingsPanel");
        if (panel) {
          panel.classList.toggle("hidden");
          if (!panel.classList.contains("hidden")) {
            panel.scrollIntoView({ behavior: "smooth" });
          }
        }
      }
      if (action === "message" && viewedProfile) startConversation(viewedProfile);
      if (action === "follow" && viewedProfile) toggleFollow(viewedProfile);
      if (action === "open-chat" && uid) {
        try {
          const profile = await loadProfile(uid);
          const id = convId || conversationId(currentUser.uid, profile.uid);
          openChatById(id, profile);
        } catch (error) {
          reportError(error);
        }
      }
    });

    document.addEventListener("submit", async e => {
      e.preventDefault();
      const form = e.target;

      if (form.id === "nicknameForm") {
        const input = form.querySelector('[name="nickname"]');
        if (!input) return;
        try {
          showNotice("");
          await saveNickname(input.value);
          myProfile = (await getDoc(userRef(currentUser.uid))).data();
          profileCache.set(currentUser.uid, myProfile);
          updateTopBar();
          startPresenceHeartbeat();
          window.location.hash = "#main";
        } catch (error) {
          reportError(error);
        }
      }

      if (form.id === "editProfileForm") {
        try {
          await saveProfile(form);
        } catch (error) {
          reportError(error);
        }
      }

      if (form.id === "searchForm") {
        const input = form.querySelector('[name="search"]');
        if (input) {
          const queryVal = input.value.trim();
          if (queryVal) {
            window.location.hash = `#search?${queryVal}`;
          } else {
            window.location.hash = `#search`;
          }
        }
      }

      if (form.id === "quickSearchForm") {
        const input = form.querySelector('[name="search"]');
        if (input) {
          window.location.hash = `#search?${input.value.trim()}`;
        }
      }

      if (form.id === "sendMessageForm") {
        sendMessage(form);
      }
    });

    getRedirectResult(auth).catch(error => {
      reportError(error);
    });

    onAuthStateChanged(auth, async user => {
      currentUser = user;
      stopLiveListeners();
      activeConversation = null;

      if (!user) {
        myProfile = null;
        if (presenceInterval) { clearInterval(presenceInterval); presenceInterval = null; }
        if (stopGlobalUnread) { stopGlobalUnread(); stopGlobalUnread = null; }
        updatePageTitle(0);
        updateTopBar();
        renderLanding();
        return;
      }

      appEl.innerHTML = `<div class="loading">Flow yükleniyor...</div>`;

      try {
        const uRef = userRef(user.uid);
        const snap = await getDoc(uRef);
        if (snap.exists() && snap.data()?.nickname) {
          myProfile = snap.data();
          profileCache.set(user.uid, myProfile);

          if (user.email && myProfile.email !== user.email) {
            await updateDoc(uRef, { email: user.email });
            myProfile.email = user.email;
            profileCache.set(user.uid, myProfile);
          }

          updateTopBar();
          startGlobalUnreadListener();
          startPresenceHeartbeat();

          if (!window.location.hash || window.location.hash === "#") {
            window.location.hash = "#main";
          } else {
            handleRoute();
          }
        } else {
          myProfile = null;
          updateTopBar();
          renderNicknameSetup();
        }
      } catch (error) {
        updateTopBar();
        reportError(error);
      }
    });
  </script>
</body>
</html>
