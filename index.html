<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { 
        getAuth, 
        signInWithPopup, 
        GoogleAuthProvider, 
        RecaptchaVerifier, 
        signInWithPhoneNumber, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        collection, 
        query, 
        where, 
        getDocs, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FlowsChat Firebase Yapılandırması
    const firebaseConfig = {
        apiKey: "AIzaSyClkgVqAKSy-ccbZNiHLkVU7EfJx66h1ew",
        authDomain: "flowschat-f611b.firebaseapp.com",
        projectId: "flowschat-f611b",
        storageBucket: "flowschat-f611b.firebasestorage.app",
        messagingSenderId: "922119996344",
        appId: "1:922119996344:web:c62d8a09bc0d503154454d",
        measurementId: "G-BVEB5N0F2X"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let googleUser = null;
    let confirmationResultGlobal = null;

    // Modal Yönetimi
    const authModal = document.getElementById('auth-modal');
    const openAuthBtn = document.getElementById('open-auth-modal-btn');
    const heroLoginBtn = document.getElementById('hero-login-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');

    const stepGoogle = document.getElementById('modal-step-google');
    const stepPhone = document.getElementById('modal-step-phone');
    const stepOtp = document.getElementById('modal-step-otp');
    const stepDashboard = document.getElementById('modal-step-dashboard');

    const openModal = () => authModal.classList.remove('hidden');
    const closeModal = () => authModal.classList.add('hidden');

    openAuthBtn.addEventListener('click', openModal);
    heroLoginBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    // 1. Google Girişi
    document.getElementById('google-login-btn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            googleUser = result.user;

            // Veritabanında önceden var olan profil kontrolü
            const userDocRef = doc(db, "users", googleUser.uid);
            const userSnap = await getDoc(userDocRef);

            if (userSnap.exists() && userSnap.data().phoneNumber) {
                showDashboard(userSnap.data());
            } else {
                stepGoogle.classList.add('hidden');
                stepPhone.classList.remove('hidden');
                setupRecaptcha();
            }
        } catch (error) {
            alert("Google girişi başarısız: " + error.message);
        }
    });

    // reCAPTCHA
    function setupRecaptcha() {
        if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                'size': 'invisible',
                'callback': () => {}
            });
        }
    }

    // 2. SMS Gönderimi (Telefon Numarası Benzersizlik Kontrolü İle)
    document.getElementById('send-otp-btn').addEventListener('click', async () => {
        const phoneNumber = document.getElementById('phone-number').value.trim();
        if (!phoneNumber) {
            alert("Lütfen telefon numaranızı girin (+90...)");
            return;
        }

        try {
            // VERİTABANINDA BU NUMARA DAHA ÖNCE KULLANILMIŞ MI KONTROL ET
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("phoneNumber", "==", phoneNumber));
            const querySnapshot = await getDocs(q);

            // Başka bir hesap bu numarayı kaydetmişse engelle
            let isUsedByAnother = false;
            querySnapshot.forEach((docSnap) => {
                if (docSnap.id !== googleUser.uid) {
                    isUsedByAnother = true;
                }
            });

            if (isUsedByAnother) {
                alert("Bu telefon numarası başka bir FlowsChat hesabına zaten kayıtlı!");
                return;
            }

            // Numara boşta ise SMS gönder
            confirmationResultGlobal = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
            stepPhone.classList.add('hidden');
            stepOtp.classList.remove('hidden');
        } catch (error) {
            alert("İşlem hatası: " + error.message);
        }
    });

    // 3. Kod Doğrulama & Firestore Kaydı
    document.getElementById('verify-otp-btn').addEventListener('click', async () => {
        const code = document.getElementById('otp-code').value.trim();
        if (!code || code.length < 6) {
            alert("Lütfen 6 haneli kodu eksiksiz yazın.");
            return;
        }

        try {
            const result = await confirmationResultGlobal.confirm(code);
            const phoneUser = result.user;

            const userData = {
                uid: googleUser.uid,
                displayName: googleUser.displayName,
                email: googleUser.email,
                photoURL: googleUser.photoURL,
                phoneNumber: phoneUser.phoneNumber,
                createdAt: serverTimestamp()
            };

            await setDoc(doc(db, "users", googleUser.uid), userData, { merge: true });

            stepOtp.classList.add('hidden');
            showDashboard(userData);
        } catch (error) {
            alert("Doğrulama kodu geçersiz: " + error.message);
        }
    });

    function showDashboard(data) {
        document.getElementById('user-name').innerText = data.displayName || "Kullanıcı";
        document.getElementById('info-email').innerText = data.email || "-";
        document.getElementById('info-phone').innerText = data.phoneNumber || "-";

        stepGoogle.classList.add('hidden');
        stepPhone.classList.add('hidden');
        stepOtp.classList.add('hidden');
        stepDashboard.classList.remove('hidden');
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.reload();
    });
</script>
