<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowsChat - Ana Sayfa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between selection:bg-black selection:text-white">

    <!-- Üst Menü -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter cursor-pointer" onclick="window.location.hash=''">FlowsChat<span class="text-indigo-600">.</span></h1>
            
            <!-- Profil Alanı (Sağ Üst) -->
            <div id="nav-profile-area" class="relative hidden">
                <button id="profile-dropdown-btn" class="flex items-center gap-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-full transition-all">
                    <img id="nav-user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full object-cover bg-gray-200">
                    <span id="nav-user-nickname" class="text-sm font-semibold pr-1"></span>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div id="profile-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-2xl shadow-xl py-2 z-50">
                    <a id="dropdown-profile-link" href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 font-medium">Profilim</a>
                    <button id="dropdown-settings-btn" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 font-medium">Ayarlar</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="max-w-6xl mx-auto w-full px-4 py-10 flex-1 grid grid-cols-1 md:grid-cols-4 gap-8">
        
        <!-- SOL/ORTA: Akış veya Profil -->
        <div class="md:col-span-3 space-y-6">
            
            <!-- ANA AKIŞ (Yeni Kullanıcılar) -->
            <div id="view-feed" class="space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4">
                    <h2 class="text-xl font-bold tracking-tight">Yeni Katılan Kullanıcılar</h2>
                    <div id="new-users-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Dinamik Yeni Kullanıcılar -->
                    </div>
                </div>
            </div>

            <!-- KULLANICI PROFİLİ (#profiles&uid) -->
            <div id="view-profile" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
                    <div class="flex flex-col sm:flex-row items-center gap-6 text-center sm:text-left">
                        <img id="profile-avatar" src="" alt="Avatar" class="w-28 h-28 rounded-full object-cover border-4 border-gray-100 bg-gray-200 shadow-inner">
                        <div class="space-y-2 flex-1">
                            <div class="flex flex-col sm:flex-row items-center gap-4">
                                <h2 id="profile-display-name" class="text-2xl font-black tracking-tight">Yükleniyor...</h2>
                                <button id="edit-profile-btn" class="hidden px-5 py-2 bg-gray-100 hover:bg-gray-200 text-sm font-semibold rounded-full transition-all">Profili Düzenle</button>
                                <button id="follow-action-btn" class="hidden px-6 py-2 bg-black text-white text-sm font-semibold rounded-full transition-all hover:bg-gray-800">Takip Et</button>
                            </div>
                            <p class="text-sm text-gray-500 font-medium">@<span id="profile-nickname"></span></p>
                            
                            <!-- Takipçi / Takip Edilen Sayaçları -->
                            <div class="flex items-center justify-center sm:justify-start gap-6 pt-2 text-sm">
                                <span class="font-semibold"><strong id="followers-count">0</strong> Takipçi</span>
                                <span class="font-semibold"><strong id="following-count">0</strong> Takip Edilen</span>
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-6 flex gap-4">
                        <button id="open-message-modal-btn" class="hidden px-6 py-3 bg-black text-white rounded-2xl text-sm font-semibold hover:bg-gray-800 transition-all flex items-center gap-2">
                            💬 Mesaj Gönder
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- SAĞ: Mesajlaşmalar -->
        <div class="space-y-4">
            <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400">Aktif Sohbetler</h3>
                <div id="chats-sidebar-list" class="space-y-2">
                    <div class="text-xs text-gray-400 text-center py-4">Sohbet bulunmuyor.</div>
                </div>
            </div>
        </div>

    </main>

    <!-- MESAJLAŞMA MODALI (WhatsApp Tarzı + Görüldü + Çift Çizgi) -->
    <div id="chat-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-gray-100 relative flex flex-col h-[600px] overflow-hidden">
            <!-- Sohbet Üst Bar -->
            <div class="p-4 bg-white border-b border-gray-100 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="chat-peer-avatar" src="" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                    <div>
                        <h4 id="chat-peer-name" class="text-sm font-bold">Kullanıcı</h4>
                        <span class="text-xs text-gray-400">Çevrimiçi</span>
                    </div>
                </div>
                <button id="close-chat-modal" class="text-gray-400 hover:text-black text-xl font-bold">&times;</button>
            </div>

            <!-- Mesaj Akış Alanı -->
            <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 flex flex-col">
                <!-- Mesajlar buraya yüklenecek -->
            </div>

            <!-- Mesaj Gönderme Alanı -->
            <div class="p-4 bg-white border-t border-gray-100 flex gap-2">
                <input type="text" id="chat-input-text" placeholder="Mesaj yazın..." class="flex-1 px-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-black focus:outline-none text-sm">
                <button id="chat-send-btn" class="px-6 py-3 bg-black text-white rounded-2xl text-sm font-semibold hover:bg-gray-800 transition-all">Gönder</button>
            </div>
        </div>
    </div>

    <!-- AYARLAR MODALI -->
    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-gray-100 relative space-y-6">
            <button id="close-settings-btn" class="absolute top-6 right-6 text-gray-400 hover:text-black text-xl font-bold">&times;</button>
            <div class="space-y-2 text-center">
                <h3 class="text-2xl font-bold tracking-tight">Hesap Ayarları</h3>
                <p class="text-sm text-gray-500">Hesap güvenliği ve kullanıcı bilgileri.</p>
            </div>
            <div class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Kullanıcı Adı (Nickname)</label>
                    <input type="text" id="settings-nickname-input" class="w-full px-4 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-black focus:outline-none transition-all text-sm">
                </div>
                <button id="save-nickname-settings-btn" class="w-full py-3.5 bg-black text-white rounded-2xl text-sm font-medium hover:bg-gray-800 transition-all">Kullanıcı Adını Güncelle</button>
                <div class="border-t border-gray-100 my-2"></div>
                <button id="modal-logout-btn" class="w-full py-3.5 px-4 bg-gray-100 text-gray-800 rounded-2xl text-sm font-medium hover:bg-gray-200 transition-all">Çıkış Yap</button>
                <button id="modal-delete-account-btn" class="w-full py-3.5 px-4 bg-red-50 text-red-600 rounded-2xl text-sm font-medium hover:bg-red-100 transition-all">Hesabımı Kalıcı Olarak Sil</button>
            </div>
        </div>
    </div>

    <!-- PROFİL DÜZENLEME MODALI -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-gray-100 relative space-y-6">
            <button id="close-edit-modal" class="absolute top-6 right-6 text-gray-400 hover:text-black text-xl font-bold">&times;</button>
            <h3 class="text-2xl font-bold tracking-tight text-center">Profili Düzenle</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Görünen Ad</label>
                    <input type="text" id="edit-display-name" class="w-full px-4 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-black focus:outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Profil Fotoğrafı URL</label>
                    <input type="text" id="edit-photo-url" placeholder="https://..." class="w-full px-4 py-3.5 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-black focus:outline-none transition-all text-sm">
                </div>
                <button id="remove-photo-btn" class="w-full py-2.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-2xl text-xs font-semibold transition-all">Resmi Kaldır (Varsayılan Beyaz Adam Yap)</button>
                <button id="save-profile-btn" class="w-full py-3.5 bg-black text-white rounded-2xl text-sm font-medium hover:bg-gray-800 transition-all">Değişiklikleri Kaydet</button>
            </div>
        </div>
    </div>

    <!-- MODERN UYARI MODALI -->
    <div id="custom-alert-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
            <h4 id="alert-title" class="text-lg font-bold">Bildirim</h4>
            <p id="alert-message" class="text-sm text-gray-500"></p>
            <button id="alert-ok-btn" class="w-full py-3 bg-black text-white rounded-2xl text-sm font-medium hover:bg-gray-800">Tamam</button>
        </div>
    </div>

    <footer class="p-6 text-center text-xs text-gray-400 border-t border-gray-100 bg-white">
        &copy; 2026 FlowsChat. Tüm hakları saklıdır.
    </footer>

    <!-- Firebase SDK ve Script -->
    <script type="module">
        import { auth, db, signOut, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs, addDoc, updateDoc, serverTimestamp, orderBy, onSnapshot } from "./firebaseConfig.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUser = null;
        let currentUserData = null;
        let activeChatUserId = null;
        let messagesUnsubscribe = null;
        const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'%3E%3Cpath fill-rule='evenodd' d='M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695 z' clip-rule='evenodd'/%3E%3C/svg%3E";

        function showAlert(title, message, callback = null) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('custom-alert-modal').classList.remove('hidden');
            document.getElementById('alert-ok-btn').onclick = () => {
                document.getElementById('custom-alert-modal').classList.add('hidden');
                if (callback) callback();
            };
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return "Yeni";
            const now = new Date();
            const past = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const diffInSeconds = Math.floor((now - past) / 1000);

            if (diffInSeconds < 60) return "Az önce";
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes} dk önce`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours} saat önce`;
            const diffInDays = Math.floor(diffInHours / 24);
            return `${diffInDays} gün önce`;
        }

        const dropdownBtn = document.getElementById('profile-dropdown-btn');
        const dropdownMenu = document.getElementById('profile-dropdown-menu');
        dropdownBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('hidden'); });
        window.addEventListener('click', () => dropdownMenu.classList.add('hidden'));

        document.getElementById('dropdown-settings-btn').addEventListener('click', () => {
            if (currentUserData) document.getElementById('settings-nickname-input').value = currentUserData.nickname || "";
            document.getElementById('settings-modal').classList.remove('hidden');
        });
        document.getElementById('close-settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));
        document.getElementById('close-edit-modal').addEventListener('click', () => document.getElementById('edit-profile-modal').classList.add('hidden'));

        document.getElementById('modal-logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            const snap = await getDoc(doc(db, "users", user.uid));
            if (!snap.exists() || !snap.data().nickname) {
                window.location.href = 'index.html';
                return;
            }

            currentUserData = snap.data();
            document.getElementById('nav-profile-area').classList.remove('hidden');
            document.getElementById('nav-user-nickname').innerText = currentUserData.nickname;
            document.getElementById('nav-user-avatar').src = currentUserData.photoURL || defaultAvatar;

            checkRoute();
        });

        window.addEventListener('hashchange', () => checkRoute());

        async function checkRoute() {
            const hash = window.location.hash;
            const viewFeed = document.getElementById('view-feed');
            const viewProfile = document.getElementById('view-profile');

            if (hash.startsWith('#profiles&')) {
                const targetUid = hash.replace('#profiles&', '');
                viewFeed.classList.add('hidden');
                viewProfile.classList.remove('hidden');
                await loadProfileData(targetUid);
            } else {
                viewProfile.classList.add('hidden');
                viewFeed.classList.remove('hidden');
                document.getElementById('dropdown-profile-link').href = `#profiles&${currentUser.uid}`;
                loadNewUsers();
            }
        }

        async function loadNewUsers() {
            const container = document.getElementById('new-users-list');
            container.innerHTML = `<div class="text-xs text-gray-400 col-span-2 text-center py-6">Yükleniyor...</div>`;

            const snap = await getDocs(collection(db, "users"));
            container.innerHTML = '';
            snap.forEach(docSnap => {
                const u = docSnap.data();
                if (u.uid === currentUser.uid) return;

                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-4 bg-gray-50 border border-gray-100 rounded-2xl hover:bg-gray-100 transition-all cursor-pointer";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${u.photoURL || defaultAvatar}" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                        <div>
                            <h4 class="text-sm font-bold">${u.displayName || u.nickname}</h4>
                            <span class="text-xs text-gray-500">@${u.nickname}</span>
                        </div>
                    </div>
                    <span class="text-[11px] font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">${getTimeAgo(u.createdAt)}</span>
                `;
                card.onclick = () => window.location.hash = `#profiles&${u.uid}`;
                container.appendChild(card);
            });
        }

        async function loadProfileData(targetUid) {
            const snap = await getDoc(doc(db, "users", targetUid));
            if (!snap.exists()) {
                document.getElementById('view-profile').innerHTML = `<div class="text-center py-20 font-bold">Kullanıcı bulunamadı.</div>`;
                return;
            }
            const data = snap.data();
            document.getElementById('profile-display-name').innerText = data.displayName || data.nickname;
            document.getElementById('profile-nickname').innerText = data.nickname;
            document.getElementById('profile-avatar').src = data.photoURL || defaultAvatar;

            const followers = data.followers || [];
            const following = data.following || [];
            document.getElementById('followers-count').innerText = followers.length;
            document.getElementById('following-count').innerText = following.length;

            const editBtn = document.getElementById('edit-profile-btn');
            const followBtn = document.getElementById('follow-action-btn');
            const messageBtn = document.getElementById('open-message-modal-btn');

            if (currentUser.uid === targetUid) {
                editBtn.classList.remove('hidden');
                followBtn.classList.add('hidden');
                messageBtn.classList.add('hidden');
                editBtn.onclick = () => {
                    document.getElementById('edit-display-name').value = data.displayName || "";
                    document.getElementById('edit-photo-url').value = data.photoURL || "";
                    document.getElementById('edit-profile-modal').classList.remove('hidden');
                };
            } else {
                editBtn.classList.add('hidden');
                followBtn.classList.remove('hidden');
                messageBtn.classList.remove('hidden');

                const isFollowing = followers.includes(currentUser.uid);
                followBtn.innerText = isFollowing ? "Takiptesin" : "Takip Et";
                followBtn.className = isFollowing 
                    ? "px-6 py-2 bg-gray-100 text-gray-800 text-sm font-semibold rounded-full transition-all hover:bg-gray-200"
                    : "px-6 py-2 bg-black text-white text-sm font-semibold rounded-full transition-all hover:bg-gray-800";

                followBtn.onclick = async () => {
                    const myRef = doc(db, "users", currentUser.uid);
                    const targetRef = doc(db, "users", targetUid);
                    
                    if (isFollowing) {
                        await updateDoc(targetRef, { followers: followers.filter(id => id !== currentUser.uid) });
                        const mySnap = await getDoc(myRef);
                        const myFollowing = mySnap.data().following || [];
                        await updateDoc(myRef, { following: myFollowing.filter(id => id !== targetUid) });
                    } else {
                        await updateDoc(targetRef, { followers: [...followers, currentUser.uid] });
                        const mySnap = await getDoc(myRef);
                        const myFollowing = mySnap.data().following || [];
                        await updateDoc(myRef, { following: [...myFollowing, targetUid] });
                    }
                    loadProfileData(targetUid);
                };

                messageBtn.onclick = () => openChatModal(targetUid, data);
            }
        }

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        async function openChatModal(peerUid, peerData) {
            activeChatUserId = peerUid;
            document.getElementById('chat-peer-name').innerText = peerData.displayName || peerData.nickname;
            document.getElementById('chat-peer-avatar').src = peerData.photoURL || defaultAvatar;
            document.getElementById('chat-modal').classList.remove('hidden');

            const chatId = getChatId(currentUser.uid, peerUid);
            const messagesRef = collection(db, "chats", chatId, "messages");
            
            if (messagesUnsubscribe) messagesUnsubscribe();

            const q = query(messagesRef, orderBy("createdAt", "asc"));
            messagesUnsubscribe = onSnapshot(q, async (snapshot) => {
                const container = document.getElementById('chat-messages-container');
                container.innerHTML = '';

                let batchUpdates = [];

                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    const isMe = m.senderUid === currentUser.uid;

                    if (!isMe && !m.seen) {
                        batchUpdates.push(updateDoc(doc(db, "chats", chatId, "messages", docSnap.id), { seen: true }));
                    }

                    const timeStr = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Şimdi';
                    
                    let ticks = '';
                    if (isMe) {
                        ticks = m.seen 
                            ? `<span class="text-blue-500 font-bold tracking-tighter ml-1">✓✓</span>` 
                            : `<span class="text-gray-400 font-bold tracking-tighter ml-1">✓✓</span>`;
                    }

                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;
                    div.innerHTML = `
                        <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-sm ${isMe ? 'bg-black text-white rounded-br-none' : 'bg-white border border-gray-200 text-gray-900 rounded-bl-none'}">
                            ${m.text}
                        </div>
                        <div class="flex items-center gap-1 text-[10px] text-gray-400 px-1">
                            <span>${timeStr}</span>
                            ${ticks}
                        </div>
                    `;
                    container.appendChild(div);
                });

                if (batchUpdates.length > 0) {
                    await Promise.all(batchUpdates);
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        document.getElementById('close-chat-modal').addEventListener('click', () => {
            document.getElementById('chat-modal').classList.add('hidden');
            if (messagesUnsubscribe) messagesUnsubscribe();
        });

        document.getElementById('chat-send-btn').addEventListener('click', async () => {
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();
            if (!text || !activeChatUserId) return;

            const chatId = getChatId(currentUser.uid, activeChatUserId);
            await addDoc(collection(db, "chats", chatId, "messages"), {
                senderUid: currentUser.uid,
                receiverUid: activeChatUserId,
                text: text,
                seen: false,
                createdAt: serverTimestamp()
            });
            input.value = '';
        });

        document.getElementById('save-nickname-settings-btn').addEventListener('click', async () => {
            const raw = document.getElementById('settings-nickname-input').value.trim();
            const lower = raw.toLowerCase();

            if (lower.length < 3) return showAlert("Uyarı", "Kullanıcı adı en az 3 karakter olmalıdır.");
            if (lower === currentUserData.nicknameLower) return showAlert("Bilgi", "Mevcut kullanıcı adınızla aynı.");

            const q = query(collection(db, "users"), where("nicknameLower", "==", lower));
            const snap = await getDocs(q);
            let taken = false;
            snap.forEach(d => { if (d.id !== currentUser.uid) taken = true; });

            if (taken) return showAlert("Hata", "Bu kullanıcı adı alınmış.");

            await setDoc(doc(db, "users", currentUser.uid), { nickname: raw, nicknameLower: lower }, { merge: true });
            document.getElementById('settings-modal').classList.add('hidden');
            showAlert("Başarılı", "Kullanıcı adınız güncellendi.", () => window.location.reload());
        });

        document.getElementById('remove-photo-btn').addEventListener('click', () => {
            document.getElementById('edit-photo-url').value = "";
            showAlert("Bilgi", "Fotoğraf temizlendi. Kaydet butonuna basarak varsayılan ikona dönebilirsiniz.");
        });

        document.getElementById('save-profile-btn').addEventListener('click', async () => {
            const newName = document.getElementById('edit-display-name').value.trim();
            const newPhoto = document.getElementById('edit-photo-url').value.trim();
            if (!newName) return showAlert("Uyarı", "Görünen ad boş olamaz.");

            await setDoc(doc(db, "users", currentUser.uid), { displayName: newName, photoURL: newPhoto }, { merge: true });
            document.getElementById('edit-profile-modal').classList.add('hidden');
            window.location.reload();
        });

        document.getElementById('modal-delete-account-btn').addEventListener('click', () => {
            showAlert("Hesabı Sil", "Hesabınızı silmek için yetkili ile görüşün.");
        });
    </script>
</body>
</html>
